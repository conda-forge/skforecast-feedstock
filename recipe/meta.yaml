{% set name = "skforecast" %}
{% set version = "0.27.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/skforecast-{{ version }}.tar.gz
  sha256: a755c4a6b8b5dba27f22f5d281a65f6016ab29af65f861bed4bbe439a6d3a0dc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=83
    - toml
    - python-build
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26.1
    - pandas >=2.2,<3.0
    - tqdm >=4.66
    - scikit-learn >=1.6
    - scipy >=1.12
    - optuna >=4.0
    - joblib >=1.3
    - numba >=0.59
    - rich >=13.9

test:
  imports:
    - skforecast
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://skforecast.org
  summary: Skforecast is a Python library for time series forecasting using machine learning models. It works with any regressor compatible with the scikit-learn API, including popular options like LightGBM, XGBoost, CatBoost, Keras, and many others.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/skforecast/skforecast

extra:
  recipe-maintainers:
    - JoaquinAmatRodrigo
    - JavierEscobarOrtiz
